include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Treat unawaited futures as a warning rather than silently ignoring them;
    # the bridge does a lot of async work.
    unawaited_futures: warning

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_locals
    - avoid_print
    - directives_ordering
