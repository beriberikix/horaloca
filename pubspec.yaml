name: horaloca
description: "A passive courtesy-clock utility that overlays your local time onto a virtual webcam."
publish_to: "none"

# Note: the version string is also surfaced in the snap and the about dialog.
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # System tray / AppIndicator integration. tray_manager wraps
  # libayatana-appindicator on Linux and is well-maintained for modern Ubuntu.
  tray_manager: ^0.2.3

  # Lets us hide the main window at launch so the app lives in the tray,
  # and pop the (future) settings window on demand.
  window_manager: ^0.3.9

  # IANA timezone database + DateTime conversion. Used by ClockService to
  # resolve the host zone and produce abbreviations like CEST / PST.
  timezone: ^0.9.4

  # Locale-aware time formatting (12h/24h, AM/PM).
  intl: ^0.19.0

  # Pure-Dart RGBA colour picker for the settings window (text/bg/border).
  flutter_colorpicker: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/tzdata/

  # NOTE: The burned-in overlay is rendered natively via Pango/Cairo, which
  # resolves the "Ubuntu" family through fontconfig — preinstalled on Ubuntu
  # and provided by the gnome snap extension. We therefore do not bundle the
  # font here. To pin the exact glyphs regardless of host, drop
  # Ubuntu-Regular.ttf / Ubuntu-Bold.ttf into assets/fonts/ and re-enable the
  # `fonts:` section below.
  #
  # fonts:
  #   - family: Ubuntu
  #     fonts:
  #       - asset: assets/fonts/Ubuntu-Regular.ttf
  #       - asset: assets/fonts/Ubuntu-Bold.ttf
  #         weight: 700
